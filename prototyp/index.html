<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Reflexionsheft – Prototyp</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <details class="steuerung" id="steuerung">
      <summary>
        <span class="steuerung__label">Prototyp</span>
        <span class="steuerung__rolle" id="steuerung-rolle"></span>
        <span class="steuerung__oeffnen">Steuerung</span>
      </summary>
      <div class="steuerung__inhalt">
        <div class="steuerung__zeile">
          <span id="steuerung-wochen-label">Woche</span>
          <div class="segmente" id="steuerung-wochen" role="group" aria-labelledby="steuerung-wochen-label"></div>
        </div>
        <label class="steuerung__zeile">
          <span>Hinweise «Zum Besprechen» zeigen</span>
          <input type="checkbox" id="steuerung-hinweise" />
        </label>
        <div class="steuerung__knoepfe">
          <button type="button" class="knopf knopf--klein knopf--zweit" id="steuerung-wechseln">Ansicht wechseln</button>
          <button type="button" class="knopf knopf--klein knopf--leise" id="steuerung-reset">Alles zurücksetzen</button>
        </div>
      </div>
    </details>

    <main id="app" class="inhalt" tabindex="-1"></main>

    <nav class="tabs" id="tabs" aria-label="Hauptnavigation" hidden>
      <a href="#/start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5" /></svg>
        <span>Start</span>
      </a>
      <a href="#/notiz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4" /></svg>
        <span>Notiz</span>
      </a>
      <a href="#/eintraege">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" /></svg>
        <span>Einträge</span>
      </a>
      <a href="#/info">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Zm0 0v13" /></svg>
        <span>Info</span>
      </a>
    </nav>

    <script src="js/inhalte.js"></script>
    <script src="js/logik.js"></script>
    <script src="js/speicher.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
