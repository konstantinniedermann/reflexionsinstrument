{% extends "basis.html" %}
{% block titel %}Anmelden – {{ instrument_titel }}{% endblock %}
{% block inhalt %}
<h1>Anmelden</h1>
<section class="karte">
  {% if fehler %}
  <p class="fehler" role="alert">{{ fehler }}</p>
  {% endif %}
  <form method="post" action="/anmelden" class="formular">
    {{ csrf_feld(request) }}
    <div class="feld">
      <label for="benutzername">Benutzername</label>
      <input type="text" id="benutzername" name="benutzername" value="{{ benutzername }}"
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
    </div>
    <div class="feld">
      <label for="passwort">Passwort</label>
      <input type="password" id="passwort" name="passwort" autocomplete="current-password" required />
    </div>
    <label class="auswahl">
      <input type="checkbox" name="dauerhaft" value="1" checked />
      Angemeldet bleiben
    </label>
    <button type="submit" class="knopf">Anmelden</button>
  </form>
  <p class="hilfe">Den Zugang erhältst du von der Projektleitung.</p>
</section>
{% block gast %}{% endblock %}
{% endblock %}
