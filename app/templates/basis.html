<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>{% block titel %}{{ instrument_titel }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/bilder/symbol-180.png" />
    <meta name="apple-mobile-web-app-title" content="{{ instrument_titel }}" />
    <meta name="theme-color" content="#f1f1f1" />
    {% block kopf_zusatz %}{% endblock %}
  </head>
  <body>
    {% set konto = konto_von(request) %}
    <header class="seitenkopf">
      <span class="seitenkopf__titel">{{ instrument_titel }}</span>
      <div class="seitenkopf__rechts">
        {% block kopf_rechts %}
        {% if konto %}
        <span class="gedaempft">{{ konto.anzeigename }}</span>
        {% endif %}
        {% endblock %}
      </div>
    </header>
    {% block navigation %}{% endblock %}
    <main class="inhalt{% block main_klasse %}{% endblock %}">
      {% block inhalt %}{% endblock %}
    </main>
    {% block fuss %}{% endblock %}
  </body>
</html>
