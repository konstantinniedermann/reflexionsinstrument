# Deploy lokal mit `make deploy`.
# Geheimer Schlüssel einmalig setzen (mindestens 32 Zeichen): fly secrets set GEHEIMER_SCHLUESSEL=...
# Benachrichtigungen (#37) einschalten: Befehl aus `python -m app.kommandos vapid-schluessel` ausführen.

app = "reflexionsinstrument"
primary_region = "fra"

[env]
  DATEN_VERZEICHNIS = "/data"
  PRODUKTION = "1"

[mounts]
  source = "daten"
  destination = "/data"
  # Snapshots bleiben nach dem Löschen des Volumes bis zum Ablauf erhalten: Ablauf in docs/loeschkonzept.md.
  initial_size = "1gb"
  snapshot_retention = 5

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
